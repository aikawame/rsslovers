services:
  crawler:
    build:
      context: crawler
      dockerfile: Dockerfile.dev
    volumes:
      - ./crawler:/rails:cached
      - ./shared:/rails/shared
      - bundle:/usr/local/bundle
  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile.dev
    ports:
      - '3000:3000'
    volumes:
      - ./frontend:/app:cached
      - ./shared:/shared
      - node_modules:/app/node_modules
volumes:
  bundle:
  node_modules:
