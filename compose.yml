services:
  crawler:
    build:
      context: crawler
      dockerfile: Dockerfile.dev
    volumes:
      - ./crawler:/rails:cached
      - ./shared:/rails/shared
      - bundle:/usr/local/bundle
  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile.dev
    ports:
      - '3000:3000'
    volumes:
      - ./frontend:/app:cached
      - ./shared:/shared
      - node_modules:/app/node_modules
  mailpit:
    image: axllent/mailpit
    environment:
      TZ: Asia/Tokyo
      MP_DATABASE: /mail_data/mailpit.db
      MP_SMTP_BIND_ADDR: '0.0.0.0:465'
    ports:
      - '465:465'
      - '8025:8025'
    volumes:
      - mail_data:/mail_data
volumes:
  bundle:
  node_modules:
  mail_data:
