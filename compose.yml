services:
  crawler:
    build:
      context: crawler
      dockerfile: Dockerfile.dev
    environment:
      RAILS_ENV: development
    volumes:
      - ./crawler:/rails:cached
      - ./shared:/rails/shared
      - bundle:/usr/local/bundle
  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile.dev
    ports:
      - '3000:3000'
    volumes:
      - ./frontend:/app:cached
      - ./shared:/shared
volumes:
  bundle:
