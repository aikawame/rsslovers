name: Crawler CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'crawler/**'
      - 'shared/**'

jobs:
  test:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./crawler

    env:
      TZ: Asia/Tokyo

    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          working-directory: ./crawler
          bundler-cache: true

      - name: Install packages
        run: bundle install

      - name: Run Rubocop
        run: bundle exec rubocop

      - name: Run RSpec
        run: bundle exec rspec
