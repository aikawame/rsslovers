name: Frontend CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'shared/**'

jobs:
  test:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '26.x'

      - name: Install packages
        run: npm install

      - name: Run Biome CI
        run: npm run check:ci

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Build Next.js
        run: npm run build
