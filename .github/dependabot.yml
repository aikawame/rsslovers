version: 2
updates:
  - package-ecosystem: bundler
    directory: /crawler
    schedule:
      interval: weekly
      day: saturday
      time: "06:00"
      timezone: Asia/Tokyo
    groups:
      version-updates:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
        exclude-patterns:
          - rails
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: saturday
      time: "06:00"
      timezone: Asia/Tokyo
    groups:
      version-updates:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
